name: Secret scan

# 只在「发版」这一刻和手动触发时跑。
#
# 原先是 `push: branches:[main]` + `pull_request`，累计触发 89 次（PR 55 / push 34）——
# 每次改一行文档都要跑一遍全历史扫描。日常防护该在本地做（见 .githooks/pre-commit），
# CI 只留最后一道：**任何东西公开发布之前**，拿 fetch-depth:0 扫一遍完整历史。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the run if any leak is found.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true
