name: CI

# 触发条件刻意收窄：日常 check 全部本地跑（见 CLAUDE.md「Common commands」），
# CI 只保留两个必要时刻——手动触发，以及打 release tag 时的发布前兜底。
# 不用 on:push / on:pull_request：那会让每次迭代都跑一遍，而这些 check 本地秒级可得。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Frontmatter lint
        run: bash tests/frontmatter-check.sh

      - name: Install smoke test
        run: bash tests/install-smoke.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run shellcheck
        run: shellcheck install.sh tests/*.sh
